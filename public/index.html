<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Citas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Sistema de Citas</h1>

  <section>
    <h2>Crear solicitud</h2>
    <form id="form-crear">
      <label>
        Nombre
        <input type="text" id="nombre" required />
      </label>
      <label>
        Contacto
        <input type="text" id="contacto" required />
      </label>
      <label>
        Fecha y hora
        <input type="datetime-local" id="fecha_hora" required />
      </label>
      <button type="submit">Crear solicitud</button>
    </form>
    <p id="resultado-crear"></p>
  </section>

  <hr />

  <section>
    <h2>Consultar estado</h2>
    <form id="form-consultar">
      <label>
        Código de seguimiento
        <input type="text" id="codigo" required />
      </label>
      <button type="submit">Consultar</button>
    </form>
    <p id="resultado-consultar"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
